name: News collection async contract

on:
  push:
    branches: [main]
    paths:
      - 'app/workflow/ports.py'
      - 'app/workflow/steps.py'
      - '.github/workflows/news-collection-async-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/workflow/ports.py'
      - 'app/workflow/steps.py'
      - '.github/workflows/news-collection-async-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  async-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify synchronous collector runs off the event loop thread
        run: python -c "import asyncio,threading; from app.workflow.ports import SyncNewsCollectionAdapter; main=threading.get_ident(); seen=[]; collector=lambda p,m:(seen.append(threading.get_ident()) or [{'title':p}]); out=asyncio.run(SyncNewsCollectionAdapter(collector).collect_news('prompt','daily')); assert out[0]['title']=='prompt'; assert seen and seen[0] != main"
